# Author: Mathew — continuous integration checks for lint, tests, and Docker build.

name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -m "not integration" --cov=app --cov-fail-under=80
      - run: docker build -t github-issues-service .
